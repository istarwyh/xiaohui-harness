name: XiaoHui macOS Release

on:
  push:
    tags:
      - xiaohui-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing xiaohui-v* tag to rebuild and publish
        required: true
        default: xiaohui-v0.2.1

permissions:
  contents: write

concurrency:
  group: xiaohui-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  RUST_TARGET: aarch64-apple-darwin
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag and desktop versions
        run: node apps/desktop-tauri/scripts/verify-release-version.mjs --tag "$RELEASE_TAG"

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'

      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop release assembly
        run: |
          pnpm --dir apps/desktop-tauri run test:bundle
          pnpm --dir apps/desktop-tauri run test:offline
          pnpm --dir apps/desktop-tauri run test:overlay
          pnpm --dir apps/desktop-tauri run test:update-manifest
          pnpm --dir apps/desktop-tauri run test:release-version

      - name: Build Harness
        env:
          DSH_CLIENT_TITLE: XiaoHui Harness
        run: pnpm run build

      - name: Build XiaoHui product runtime
        run: pnpm --dir apps/desktop-tauri run prepare:product-runtime

      - name: Build app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir apps/desktop-tauri run build

      - name: Test relocated XiaoHui product runtime
        run: |
          bundled="apps/desktop-tauri/src-tauri/target/$RUST_TARGET/release/bundle/macos/XiaoHui Harness.app/Contents/Resources/xiaohui-runtime"
          relocated="$RUNNER_TEMP/xiaohui-runtime-relocated"
          ditto "$bundled" "$relocated"
          cp -L "$relocated/venv/bin/python" "$RUNNER_TEMP/xiaohui-python-bundle-copy"
          rm "$relocated/venv/bin/python"
          mv "$RUNNER_TEMP/xiaohui-python-bundle-copy" "$relocated/venv/bin/python"
          test ! -L "$relocated/venv/bin/python"
          sed -i '' 's|^home = .*|home = /private/nonexistent/xiaohui-python/bin|' "$relocated/venv/pyvenv.cfg"
          env -u PYTHONHOME "$relocated/venv/bin/harbor" --version
          env -u PYTHONHOME "$relocated/venv/bin/harbor-dsh" --help >/dev/null

      - name: Test native desktop runtime
        run: cargo test --locked --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml

      - name: Stage release assets
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $bundleRoot = "apps/desktop-tauri/src-tauri/target/$env:RUST_TARGET/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null

          $dmg = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
          $updater = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.app.tar.gz' | Select-Object -First 1
          if (-not $dmg -or -not $updater) { throw "DMG or updater archive not found under $bundleRoot" }
          $signature = Get-Item "$($updater.FullName).sig" -ErrorAction Stop

          Copy-Item $dmg.FullName "release-assets/xiaohui-harness-$version-macos-arm64.dmg"
          $updaterDestination = "release-assets/xiaohui-harness-$version-macos-arm64.app.tar.gz"
          Copy-Item $updater.FullName $updaterDestination
          Copy-Item $signature.FullName "$updaterDestination.sig"
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -NoNewline:$false release-assets/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xiaohui-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: xiaohui-macos-arm64
          path: release-assets

      - name: Verify release asset set
        shell: pwsh
        run: |
          $expected = @(
            '*-macos-arm64.dmg',
            '*-macos-arm64.app.tar.gz',
            '*-macos-arm64.app.tar.gz.sig',
            'SHA256SUMS.txt'
          )
          foreach ($pattern in $expected) {
            if (-not (Get-ChildItem release-assets -File -Filter $pattern)) {
              throw "Missing release asset matching $pattern"
            }
          }

      - name: Verify release checksums
        run: cd release-assets && sha256sum --check SHA256SUMS.txt

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          node apps/desktop-tauri/scripts/generate-updater-manifest.mjs `
            --assets-dir release-assets `
            --output release-assets/latest.json `
            --version $version `
            --repository $env:GITHUB_REPOSITORY `
            --release-tag $env:RELEASE_TAG `
            --notes-file apps/desktop-tauri/release-notes.md `
            --pub-date $publishedAt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "XiaoHui Harness ${RELEASE_TAG#xiaohui-v}" --notes-file apps/desktop-tauri/release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "XiaoHui Harness ${RELEASE_TAG#xiaohui-v}" --notes-file apps/desktop-tauri/release-notes.md --latest
          fi

          if gh release view xiaohui-updater >/dev/null 2>&1; then
            gh release upload xiaohui-updater release-assets/latest.json --clobber
          else
            gh release create xiaohui-updater release-assets/latest.json --target "$(git rev-parse HEAD)" --title "XiaoHui Harness update channel" --notes "Signed macOS arm64 update manifest." --prerelease
          fi
